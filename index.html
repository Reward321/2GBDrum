<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>2GBDrum</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="drum-machine">

    <h1>2GBDrum</h1>

    <div class="pads">

      <button class="pad" data-sound="tom" data-key="1">
        <small>1</small>
        TOM
      </button>

      <button class="pad" data-sound="rom" data-key="2">
        <small>2</small>
        ROM
      </button>

      <button class="pad" data-sound="crash" data-key="3">
        <small>3</small>
        CRASH
      </button>

      <button class="pad" data-sound="bell" data-key="4">
        <small>4</small>
        BELL
      </button>

      <button class="pad" data-sound="kick" data-key="5">
        <small>5</small>
        KICK
      </button>

      <button class="pad" data-sound="snare" data-key="6">
        <small>6</small>
        SNARE
      </button>

      <button class="pad" data-sound="closed-hihat" data-key="7">
        <small>7</small>
        CLOSED HI-HAT
      </button>

      <button class="pad" data-sound="open-hihat" data-key="8">
        <small>8</small>
        OPEN HI-HAT
      </button>

    </div>

    <p class="hint">Press 1–8 on PC or tap the pads</p>

    <footer>2gbdrum.org</footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
